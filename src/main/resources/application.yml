spring:
  application:
    name: ledgerflow
  datasource:
    url: jdbc:h2:mem:ledgerflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

server:
  port: 8080

ledgerflow:
  holds:
    expiry:
      interval: PT30S
  outbox:
    poll-interval: PT2S
    max-attempts: 8
    base-backoff: PT5S
    max-backoff: PT30M
    # webhook-url: https://example.com/hooks/ledger
    # webhook-secret: change-me-to-a-long-random-secret
