spring:
  application:
    name: ledgerflow
  datasource:
    url: jdbc:h2:mem:ledgerflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

ledgerflow:
  holds:
    expiry:
      interval: PT30S
